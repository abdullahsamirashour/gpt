name: Media Lite Smart Tabs checks

on:
  push:
    branches:
      - "feature/media-lite-smart-tabs-2026-11-20"
      - main
    paths:
      - "telegram-smart-compressor/smart_tabs_ui.py"
      - "telegram-smart-compressor/Smart_Compressor.ipynb"
      - "telegram-smart-compressor/test_smart_tabs_ui.py"
      - ".github/workflows/media-lite-smart-tabs-ci.yml"
  pull_request:
    paths:
      - "telegram-smart-compressor/smart_tabs_ui.py"
      - "telegram-smart-compressor/Smart_Compressor.ipynb"
      - "telegram-smart-compressor/test_smart_tabs_ui.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UI test dependency
        run: python -m pip install -q "ipywidgets>=8,<9"
      - name: Compile and validate notebook
        run: |
          python -m py_compile telegram-smart-compressor/smart_tabs_ui.py
          python -m py_compile telegram-smart-compressor/test_smart_tabs_ui.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          path = Path("telegram-smart-compressor/Smart_Compressor.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook["nbformat"] == 4
          assert len(notebook["cells"]) == 4
          for cell in notebook["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]))
                  assert not cell["outputs"]
          print("Notebook JSON and code syntax OK")
          PY
      - name: Widget behavior and dispatch tests
        run: python -m unittest discover -s telegram-smart-compressor -p test_smart_tabs_ui.py -v
