name: Gemini 3.5 Live Full E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}
      FULL_REPORT_PATH: gemini35_live_full_e2e_report.json
      FULL_TRANSCRIPT_PATH: gemini35_live_full_transcript.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "google-genai==2.25.0"

      - name: Syntax check
        run: python -m py_compile gemini-live-transcriber/production_test.py

      - name: Run full E2E
        run: python gemini-live-transcriber/production_test.py

      - name: Upload full E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini35-live-full-e2e
          path: |
            gemini35_live_full_e2e_report.json
            gemini35_live_full_transcript.txt
          if-no-files-found: warn
          retention-days: 7
