name: Gemini 3.5 Live Audio Speed Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "gemini-live-transcriber/audio_speed_benchmark.request"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "google-genai==2.25.0"

      - name: Syntax check
        run: |
          python -m py_compile gemini-live-transcriber/production_test.py
          python -m py_compile gemini-live-transcriber/audio_speed_benchmark.py

      - name: Run speed benchmark
        working-directory: gemini-live-transcriber
        run: python audio_speed_benchmark.py

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini35-live-audio-speed-benchmark
          path: gemini-live-transcriber/gemini_speed_audio_benchmark/
          if-no-files-found: warn
          retention-days: 7
