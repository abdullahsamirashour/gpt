name: Gemini Ready Smart Audio checks

on:
  push:
    branches: [main, "feature/media-lite-gemini-smart-2026-11-20"]
    paths:
      - "telegram-smart-compressor/gemini_ready_engine.py"
      - "telegram-smart-compressor/smart_tabs_ui.py"
      - "telegram-smart-compressor/test_gemini_ready_engine.py"
      - "telegram-smart-compressor/test_smart_tabs_ui.py"
      - ".github/workflows/gemini-ready-smart-ci.yml"
  pull_request:
    paths:
      - "telegram-smart-compressor/gemini_ready_engine.py"
      - "telegram-smart-compressor/smart_tabs_ui.py"
      - "telegram-smart-compressor/test_gemini_ready_engine.py"
      - "telegram-smart-compressor/test_smart_tabs_ui.py"
      - ".github/workflows/gemini-ready-smart-ci.yml"

jobs:
  audio-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -q pytest pytest-asyncio ipywidgets
      - name: Check FFmpeg availability
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Compile all components
        run: |
          python -m py_compile telegram-smart-compressor/gemini_ready_engine.py
          python -m py_compile telegram-smart-compressor/smart_tabs_ui.py
          python -m py_compile telegram-smart-compressor/test_gemini_ready_engine.py
      - name: Real audio tests and verified-Drive simulations
        run: python -m pytest -q telegram-smart-compressor/test_gemini_ready_engine.py -ra
      - name: Tab dispatch regressions
        run: python -m unittest discover -s telegram-smart-compressor -p test_smart_tabs_ui.py -v
