name: Validate Smart Compressor

on:
  push:
    branches: [beta, main]
    paths:
      - 'telegram-smart-compressor/**'
      - '.github/workflows/validate-smart-compressor.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime test dependencies
        run: |
          python -m pip install -q telethon==1.45.0 cryptg nest_asyncio aiofasttelethonhelper==0.1.3
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Compile engine
        run: python -m py_compile telegram-smart-compressor/engine.py

      - name: Validate Colab notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidates = [
              Path("telegram-smart-compressor/launcher-beta.ipynb"),
              Path("telegram-smart-compressor/Smart_Compressor.ipynb"),
              Path("telegram-smart-compressor/launcher.ipynb"),
          ]

          found = 0
          for path in candidates:
              if not path.exists():
                  continue

              found += 1
              nb = json.loads(path.read_text(encoding="utf-8"))
              assert nb["nbformat"] == 4
              code_cells = [c for c in nb["cells"] if c.get("cell_type") == "code"]
              markdown_cells = [c for c in nb["cells"] if c.get("cell_type") == "markdown"]
              assert code_cells and markdown_cells

              code_cell = code_cells[0]
              code = "".join(code_cell.get("source", []))
              md = "".join(markdown_cells[0].get("source", []))

              assert code_cell.get("metadata", {}).get("cellView") == "form"
              assert "#@title" in code
              assert code.count("#@param") >= 2
              assert "\\n" not in md
              assert "re.search(r'ENGINE_BUNDLE_VERSION" not in code
              if path.name == "launcher-beta.ipynb":
                  assert 'os.environ["TSC_ENGINE_SHA"] = sha' in code
                  assert 'BRANCH = "beta"' in code
              compile(code, str(path), "exec")
              print("OK notebook:", path)

          assert found >= 1
          PY

      - name: Engine logic and FFmpeg smoke tests
        env:
          TSC_TEST_MODE: '1'
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          path = Path("telegram-smart-compressor/engine.py")
          spec = importlib.util.spec_from_file_location("tsc_engine", path)
          engine = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = engine
          spec.loader.exec_module(engine)

          assert engine.ENGINE_BUNDLE_VERSION.startswith("5.5.")
          assert engine.WORKSPACE_TITLE == "🗜️ اضغطها | Media Lite"
          assert engine.APP_NAME == "اضغطها | Media Lite"
          assert engine.BRANDING_VERSION == "media-lite-v1"
          assert engine.TURBO_MAX_CONNECTIONS == 20
          assert engine.TURBO_PART_KB == 512
          assert engine.transfer_connection_count(8 * 1024 * 1024) == 4
          assert engine.transfer_connection_count(82 * 1024 * 1024) == 17
          assert engine.transfer_connection_count(234 * 1024 * 1024) == 20

          for brand_file in (engine.BRAND_LOGO_FILE, engine.BRAND_BANNER_FILE):
              brand_path = engine.get_brand_asset(brand_file)
              assert brand_path.exists()
              data = brand_path.read_bytes()
              assert len(data) > 5000
              assert data[:2] == b"\xff\xd8"

          pin_html = engine.pinned_message_html()
          assert "اضغطها | Media Lite" in pin_html
          assert engine.COLAB_URL in pin_html
          assert "<code>1</code>" in pin_html

          setup_html = engine.first_time_setup_html()
          assert "https://my.telegram.org/apps" in setup_html
          assert "توصيل تيليجرام لأول مرة" in setup_html
          complete_config = {"api_id": 123, "api_hash": "abc", "phone": "+201000000000"}
          assert engine.first_time_setup(dict(complete_config)) == complete_config

          assert engine.parse_rerun_command("1") == {"profile": None, "target_mb": None}
          assert engine.parse_rerun_command("2")["profile"] == "VIDEO_SMALLEST"
          assert engine.parse_rerun_command("3")["profile"] == "AUDIO_TINY"
          assert engine.parse_rerun_command("80") == {"profile": "VIDEO_TARGET_SIZE", "target_mb": 80}
          assert engine.parse_rerun_command("🔁") == {"profile": None, "target_mb": None}
          assert engine.parse_rerun_command("🔁 أصغر")["profile"] == "VIDEO_SMALLEST"
          assert engine.parse_rerun_command("🔁 صوت")["profile"] == "AUDIO_TINY"

          class Obj:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)

          class Msg:
              def __init__(self, mid, kind=None, text="", reply=None):
                  self.id = mid
                  self.message = text
                  self.reply_to_msg_id = reply
                  self.media = object() if kind else None
                  if kind:
                      mime = "video/mp4" if kind == "video" else "audio/mpeg"
                      self.file = Obj(mime_type=mime, name=f"f{mid}", ext=".mp4" if kind == "video" else ".mp3")
                      self.video = object() if kind == "video" else None
                      self.audio = object() if kind == "audio" else None
                      self.voice = None
                  else:
                      self.file = None
                      self.video = None
                      self.audio = None
                      self.voice = None

          class FakeClient:
              def __init__(self, messages):
                  self.messages = sorted(messages, key=lambda m: m.id, reverse=True)
                  self.by_id = {m.id: m for m in messages}

              async def get_messages(self, _channel, limit=None, ids=None):
                  if ids is not None:
                      return self.by_id.get(ids)
                  return self.messages[:limit] if limit else self.messages

          async def queue_test():
              messages = [
                  Msg(1, "video"),
                  Msg(2, "video", text="✅ v1 • فيديو متوازن"),
                  Msg(3, text="2", reply=2),
                  Msg(4, "audio"),
                  Msg(5, text="1", reply=4),
                  Msg(6, "video", text="✅ v2 • فيديو متوازن"),
                  Msg(7, "video"),
                  Msg(8, "video"),
                  Msg(9, "video", text="✅ v1 • فيديو متوازن", reply=8),
              ]
              state = {
                  "processed_source_ids": [1],
                  "output_ids": [2],
                  "command_ids": [],
                  "lineage": {},
              }
              jobs = await engine.collect_queue(FakeClient(messages), object(), state)
              compact = [(j["source"].id, j["rerun"], j["profile"]) for j in jobs]
              assert compact == [
                  (2, True, "VIDEO_SMALLEST"),
                  (4, True, None),
                  (7, False, None),
              ], compact
              assert 8 in state["processed_source_ids"]
              assert 9 in state["output_ids"]

          asyncio.run(queue_test())

          # v4 state must merge into an existing v5 state instead of replacing it.
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              engine.OLD_STATE_PATH = td / "processed_v4.json"
              engine.STATE_PATH = td / "state_v5.json"
              engine.OLD_STATE_PATH.write_text(
                  json.dumps({"123": {"sources": [1, 2], "outputs": [9]}}),
                  encoding="utf-8",
              )
              state = {
                  "processed_source_ids": [3],
                  "output_ids": [10],
                  "command_ids": [20],
                  "lineage": {},
              }
              migrated = engine.migrate_old_state(Obj(id=123), state)
              assert migrated["processed_source_ids"] == [1, 2, 3]
              assert migrated["output_ids"] == [9, 10]
              assert migrated["command_ids"] == [20]

          # Workspace creation must recover from transient Telegram RPC failures.
          class RpcCallFailError(Exception):
              pass

          class FakeDialog:
              def __init__(self, entity):
                  self.name = engine.WORKSPACE_TITLE
                  self.entity = entity

          class FakeWorkspaceClient:
              def __init__(self):
                  self.create_calls = 0
                  self.dialogs = []
                  self.channel = Obj(id=555, creator=True, admin_rights=None)

              async def get_entity(self, _peer):
                  raise ValueError("not found")

              def iter_dialogs(self):
                  async def gen():
                      for dialog in list(self.dialogs):
                          yield dialog
                  return gen()

              async def __call__(self, request):
                  if type(request).__name__ == "CreateChannelRequest":
                      self.create_calls += 1
                      if self.create_calls == 1:
                          raise RpcCallFailError("Telegram is having internal issues, please try again later.")
                      return Obj(chats=[self.channel])
                  return Obj()

              async def get_messages(self, _channel, ids=None):
                  return None

              async def send_message(self, _channel, _text, **_kwargs):
                  return Obj(id=777)

              async def edit_message(self, _channel, _message, _text, **_kwargs):
                  return Obj(id=getattr(_message, "id", 777))

              async def pin_message(self, *_args, **_kwargs):
                  return None

              async def get_input_entity(self, _channel):
                  return types.InputPeerSelf()

          async def workspace_retry_test():
              old_config_path = engine.CONFIG_PATH
              old_sleep = engine.asyncio.sleep
              with tempfile.TemporaryDirectory() as td:
                  engine.CONFIG_PATH = Path(td) / "config.json"

                  async def no_sleep(_seconds):
                      return None
                  engine.asyncio.sleep = no_sleep

                  client = FakeWorkspaceClient()
                  channel, created = await engine.ensure_workspace(client, {})
                  assert channel.id == 555
                  assert created is True
                  assert client.create_calls == 2
              engine.CONFIG_PATH = old_config_path
              engine.asyncio.sleep = old_sleep

          asyncio.run(workspace_retry_test())

          class ChannelsTooMuchError(Exception):
              pass

          class UserRestrictedError(Exception):
              pass

          class WeirdTelegramError(Exception):
              pass

          class AlwaysFailWorkspaceClient(FakeWorkspaceClient):
              def __init__(self, error):
                  super().__init__()
                  self.error = error

              async def __call__(self, request):
                  self.create_calls += 1
                  raise self.error

          async def workspace_error_mapping_test():
              old_config_path = engine.CONFIG_PATH
              old_sleep = engine.asyncio.sleep
              with tempfile.TemporaryDirectory() as td:
                  engine.CONFIG_PATH = Path(td) / "config.json"

                  async def no_sleep(_seconds):
                      return None
                  engine.asyncio.sleep = no_sleep

                  cases = [
                      (ChannelsTooMuchError("CHANNELS_TOO_MUCH"), "E132"),
                      (UserRestrictedError("USER_RESTRICTED"), "E133"),
                      (WeirdTelegramError("SOMETHING_ELSE"), "E134"),
                  ]

                  for error, expected in cases:
                      try:
                          await engine.ensure_workspace(AlwaysFailWorkspaceClient(error), {})
                      except engine.AppError as exc:
                          assert exc.code == expected, (type(error).__name__, exc.code)
                      else:
                          raise AssertionError(f"Expected {expected}")
              engine.CONFIG_PATH = old_config_path
              engine.asyncio.sleep = old_sleep

          asyncio.run(workspace_error_mapping_test())

          # Parallel transfer dependency is importable on Python 3.13 / Telethon 1.45.
          from aiofasttelethonhelper.core.transfer import ParallelTransferrer
          import aiofasttelethonhelper.core.transfer as transfer_mod
          import inspect
          assert "connection_count" in inspect.signature(ParallelTransferrer.download).parameters
          assert "connection_count" in inspect.signature(ParallelTransferrer.init_upload).parameters

          # Fast upload uses the adaptive connection budget and returns a Telegram input file.
          class FakeProgress:
              def __init__(self):
                  self.done = 0
                  self.finished = 0
              def update(self, done, total):
                  self.done = done
              def finish(self, total):
                  self.finished = total
                  return 1.0

          class FakeTransferrer:
              last_connections = None
              def __init__(self, client, dc_id=None):
                  self.senders = []
              async def init_upload(self, file_id, file_size, part_size_kb=None, connection_count=None):
                  type(self).last_connections = connection_count
                  part_size = int(part_size_kb * 1024)
                  part_count = (file_size + part_size - 1) // part_size
                  return part_size, part_count, True
              async def upload(self, part):
                  return None
              async def finish_upload(self):
                  return None
              async def _cleanup(self):
                  return None

          async def fast_upload_test():
              original = transfer_mod.ParallelTransferrer
              transfer_mod.ParallelTransferrer = FakeTransferrer
              try:
                  with tempfile.TemporaryDirectory() as td:
                      src = Path(td) / "upload.mp4"
                      src.write_bytes(b"x" * (9 * 1024 * 1024))
                      progress = FakeProgress()
                      uploaded, mode, elapsed = await engine.upload_media_fast(object(), src, progress)
                      assert mode == "turbo"
                      assert uploaded.name == src.name
                      assert progress.finished == src.stat().st_size
                      assert FakeTransferrer.last_connections == engine.transfer_connection_count(src.stat().st_size)
                      assert 4 <= FakeTransferrer.last_connections <= 20
              finally:
                  transfer_mod.ParallelTransferrer = original

          asyncio.run(fast_upload_test())

          # Telethon API objects used by the engine still match the pinned version.
          from telethon import functions, types
          req = functions.channels.CreateChannelRequest(title="x", about="x", broadcast=True, megagroup=False)
          assert req.broadcast is True
          functions.channels.EditTitleRequest(channel=types.InputChannelEmpty(), title="🗜️ اضغطها | Media Lite")
          functions.messages.EditChatAboutRequest(peer=types.InputPeerSelf(), about="x")
          uploaded_photo_file = types.InputFile(
              id=1,
              parts=1,
              name="x.jpg",
              md5_checksum="0" * 32,
          )
          functions.channels.EditPhotoRequest(
              channel=types.InputChannelEmpty(),
              photo=types.InputChatUploadedPhoto(file=uploaded_photo_file),
          )
          functions.messages.ToggleDialogPinRequest(
              pinned=True,
              peer=types.InputDialogPeer(peer=types.InputPeerSelf()),
          )
          types.DocumentAttributeAudio(duration=1, voice=False, title="x", performer="")
          types.DocumentAttributeVideo(duration=1, w=320, h=240, supports_streaming=True)

          # Critical Colab case: run() must work even when an event loop is already running.
          ran = {"value": False}
          async def dummy_app():
              ran["value"] = True
          engine.app = dummy_app
          engine.ensure_dependencies = lambda: None

          async def outer():
              engine.run()
              assert ran["value"] is True
          asyncio.run(outer())

          # NVENC failures must fall back to CPU instead of failing the file.
          original_run_ffmpeg = engine.run_ffmpeg
          codec_calls = []
          def fake_run_ffmpeg(cmd, duration, label):
              codec_calls.append(cmd)
              if "h264_nvenc" in cmd:
                  raise engine.AppError("E420", "synthetic NVENC failure")
          engine.run_ffmpeg = fake_run_ffmpeg
          try:
              engine.encode_video(
                  Path("/tmp/fake-input.mp4"),
                  Path("/tmp/fake-output.mp4"),
                  engine.MediaInfo(
                      duration=2.0,
                      size=1000,
                      width=640,
                      height=360,
                      fps=24.0,
                      has_video=True,
                      has_audio=True,
                  ),
                  "VIDEO_BALANCED",
                  None,
                  True,
              )
              assert len(codec_calls) == 2
              assert "h264_nvenc" in codec_calls[0]
              assert "libx264" in codec_calls[1]
          finally:
              engine.run_ffmpeg = original_run_ffmpeg

          # Actual FFmpeg encode smoke tests.
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              src = td / "source.mp4"
              subprocess.run(
                  [
                      "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                      "-f", "lavfi", "-i", "testsrc2=size=640x360:rate=24",
                      "-f", "lavfi", "-i", "sine=frequency=700:sample_rate=44100",
                      "-t", "2",
                      "-c:v", "libx264", "-preset", "ultrafast", "-crf", "20",
                      "-c:a", "aac", "-b:a", "96k",
                      str(src),
                  ],
                  check=True,
              )

              info = engine.ffprobe(src)
              assert info.has_video and info.has_audio and info.duration > 1.5
              assert engine.classify_video_complexity(src, info) in {"STATIC", "NORMAL", "DETAIL"}

              audio_out = td / "audio.ogg"
              engine.encode_audio(src, audio_out, info)
              assert audio_out.exists() and audio_out.stat().st_size > 0
              audio_info = engine.ffprobe(audio_out)
              assert audio_info.has_audio and not audio_info.has_video

              video_out = td / "video.mp4"
              engine.encode_video(src, video_out, info, "VIDEO_BALANCED", None, False)
              assert video_out.exists() and video_out.stat().st_size > 0
              video_info = engine.ffprobe(video_out)
              assert video_info.has_video
              assert video_info.width <= 640 and video_info.height <= 360

          print("ALL SMART COMPRESSOR TESTS PASSED")
          PY
